apiVersion: v1
data:
  init.sql: "USE school;\r\n\r\nCREATE TABLE IF NOT EXISTS student (\r\n    id INT
    NOT NULL PRIMARY KEY,\r\n    name VARCHAR(100) NOT NULL,\r\n    roll_number INT
    NOT NULL,\r\n    class VARCHAR(100)\r\n);\r\n\r\nCREATE TABLE IF NOT EXISTS teacher
    (\r\n    id INT NOT NULL PRIMARY KEY,\r\n    name VARCHAR(100) NOT NULL,\r\n    subject
    VARCHAR(100) NOT NULL,\r\n    class VARCHAR(100)\r\n);"
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: three-tier
